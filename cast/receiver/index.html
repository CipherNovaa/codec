body{margin:0;background:#0d1119;color:#e7ecf3;font-family:system-ui,sans-serif}
/* Sink CAF's own player (and its built-in transport) to the bottom stacking
   layer so codec's overlays — the room card, and especially our own transport
   bar (#tbar, z-index 6) — paint ABOVE it. Without an explicit z-index here
   CAF's native scrub bar drew on top of ours (two bars on screen). */
/* --progress-color is DEFENSE-IN-DEPTH only: custom properties inherit through
   shadow boundaries into the SDK's own chrome, so even if the hideCafTransport
   injection below ever failed, the native bar's FILL goes invisible. The real
   kill — bar, track, timestamps, glyph — is the stylesheet hideCafTransport
   injects into the overlay's shadow root. */
cast-media-player{--background-color:#0d1119;--theme-hue:220;
 --progress-color:rgba(0,0,0,0);position:fixed;inset:0;z-index:0}
/* The MSE video sits above CAF's player, below the room card (which fades on
   play). Object-fit contain so a 4K frame letterboxes rather than crops. */
#mv{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:2;
 background:#000;object-fit:contain}
/* Hand-rendered subtitles. A SIBLING of cast-media-player (z 5, above both video
 surfaces, below the room card/transport), so the zoom transform never scales or
 clips it — subs stay put whether the picture is at fit or zoomed. Font/size/colour
 come from Settings; the MGS face is the default. Shadowed, not boxed, so it reads
 over a bright frame without laying a bar across the shot. */
#cap{position:fixed;left:5%;right:5%;bottom:6%;z-index:5;display:none;
 text-align:center;pointer-events:none;line-height:1.3;
 font-family:var(--capfont,mgscodec,ui-monospace,monospace);font-size:var(--capsize,2.45vh);
 color:var(--capcolor,#FFFFFF);letter-spacing:.02em;
 text-shadow:0 2px 10px #000,0 0 4px #000,0 0 2px #000}
#cap .l{display:inline-block;padding:.04em .3em;border-radius:.08em}
#cap.boxed{text-shadow:none}
#cap.boxed .l{background:rgba(0,0,0,.65)}
/* ── the party face: the guest web player, on a television ─────────────────
   A party LOAD puts the receiver in the same face a phone or laptop guest
   sees (body.party): one glass plate along the foot of the frame (the app's
   osd-tex 9-slice) carrying the title logo, the room's clock as a pixel track,
   elapsed / who's here / remaining, and the lane this set is ACTUALLY on as the
   library's own format badges; the hold for a film change, the end of the
   queue and the party closing; the room's chat as a fading feed; the poster
   card when the room is paused. The solo faces (#room, #tbar, #ldr) are
   untouched — simply hidden while the party face is up — so a solo cast
   looks exactly as it did until that face is moved over too.
   A CAF receiver lays out at 1280x720 CSS px whatever the panel, so the web
   player's sizes carry over nearly as they are; --t1/--t2 (texLaw) keep every
   art pixel a whole number of device pixels, the integer-scale law. */
:root{--t1:1px;--t2:2px;--dk:0px}
#pdock,#posd,#pcpw,#pcmeta .mbadge,#plog .ln{will-change:transform}
/* a solo cast: the same face without the room — no roster, no feed, the
   plain CODEC mark; everything else (dock, readouts, card, hero, holds) is
   shared, so the two cannot drift apart */
body.solo #proster,body.solo #pchat,body.solo .wp{display:none}
body.solo #pdrem{margin-left:auto}   /* no roster: the remaining pair keeps the right edge, like the app's */
/* a YouTube cast: its thumbnail is 16:9, so the card's frame is landscape */
#pcard.yt #pcpw{width:236px;aspect-ratio:16/9}
#pcard.yt #pctitle{font-size:26px;line-height:1.2}
/* the dock */
#pdock{position:fixed;z-index:9;left:40px;right:40px;bottom:30px;display:flex;
 flex-direction:column;gap:9px;padding:13px 18px 12px;color:#e7ecf3;
 font-family:mgshud,ui-monospace,monospace;opacity:0;pointer-events:none;
 transform:translateY(10px);transition:opacity .25s,transform .3s cubic-bezier(.2,.75,.2,1)}
#pdock.show{opacity:1;transform:none}
#pdock::before{content:"";position:absolute;inset:0;z-index:-1;border-style:solid;
 border-width:calc(8*var(--t1));border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAXBJREFUeJztmzFOAzEQRcf2XgCJimtxBErEAagQFQdAlByBa1EhcYH1mGqiXeJ1UqA8vJ4nrZTEivT/m81WmSAicnV9U2RAvr8+Qxi1vDEt37y9f3BJLsj93e3h9eEOsPJPjw9csgvw/PIqspAQl4dWPsa4y0sqA179BKy8iEhKR0ddk/MsMUZR1dXn1ZZW3mT0jqpKSpPkPB+dbY7ZyvcuQVWrkzea97mVD6FPCaW0y8vvh2CNXsvLmdn7bfdHuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQnBRQyvZfzf8752Rv7gvYskHPElq7AtIScGrToidaHaoCcp4lpWkX5Y3avpDUBNjkt77QM7WBrh6CtlSoqru8lh2N1e7w0KuzoxJk8PX5H9UkA3oXAEQrAAAAAElFTkSuQmCC) 8 fill / calc(8*var(--t1)) / 0 stretch;
 image-rendering:pixelated;opacity:.9}
.pdtop{display:flex;align-items:center;gap:14px;min-height:30px}
#pdglyph{width:calc(13*var(--t2));height:calc(13*var(--t2));flex:none;image-rendering:pixelated;
 background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA0AAAANCAYAAABy6+R8AAAAUklEQVR4nGNgoAZ49PzVf0JqmMjRyESOjUz4THyEQyNeTbg0EtSETSNRmhwsvRiUFEz+E63JwdILTN97cIaRKE3YNODVhEsDTk34NOAEyJ7GBgCkRycmgsroywAAAABJRU5ErkJggg==) center/100% 100% no-repeat}
#pdglyph.pz{background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA0AAAANCAYAAABy6+R8AAAAOElEQVR4nGNgIAMwwhiPnr/6D2PLSYrhFWfCZpKSgsl/fOJYNRECo5qgYJAHBAuMAUoi2FICNnEA4EIOiqRjxj0AAAAASUVORK5CYII=)}
#pdlogo{display:none;height:44px;margin:-6px 0;width:auto;max-width:min(42%,380px);object-fit:contain;
 object-position:left center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.85))}
#pdock.logo #pdlogo{display:block;animation:lnIn .4s cubic-bezier(.2,.75,.2,1) both}
#pdtitle{font:26px/1.1 mgshud,ui-monospace,monospace;letter-spacing:.06em;flex:1;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#pdock.logo #pdtitle{flex:0 0 auto;color:#9aa4b2;font-size:20px}
/* what this set is actually playing, the way the app's own OSD says it:
   WxH · DV/HDR from the lane it reads and the size shaka reports (never the
   panel's claim), FIT/ZOOM, A: the lane's soundtrack · S: the active track,
   and the set's volume as the OSD's 10-step gauge */
#pdmeta{display:flex;gap:16px;align-items:center;margin-left:auto;flex:none;
 font:20px/1 mgshud,ui-monospace,monospace;letter-spacing:.06em;color:#9aa4b2;
 text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
#pdmeta span:empty{display:none}
/* the range word wears the codec face — DV / HDR read as the mark they are (Seth) */
#pdvid .rng{font:400 14px/1 mgscodec,ui-monospace,monospace;letter-spacing:.08em;color:inherit}
#pdzoom{font:400 14px/1 mgscodec,ui-monospace,monospace;letter-spacing:.08em}
#pdvol{display:none;align-items:center;gap:8px}
#pdvol.on{display:inline-flex}
#pdvol .vg{width:18px;height:12px;flex:none;color:#a6b1c7;background:
  linear-gradient(currentColor,currentColor) 0 50%/4px 6px no-repeat,
  linear-gradient(currentColor,currentColor) 4px 50%/4px 12px no-repeat}
#pdvol.l1 .vg{background:
  linear-gradient(currentColor,currentColor) 0 50%/4px 6px no-repeat,
  linear-gradient(currentColor,currentColor) 4px 50%/4px 12px no-repeat,
  linear-gradient(currentColor,currentColor) 11px 50%/2px 6px no-repeat}
#pdvol.l2 .vg{background:
  linear-gradient(currentColor,currentColor) 0 50%/4px 6px no-repeat,
  linear-gradient(currentColor,currentColor) 4px 50%/4px 12px no-repeat,
  linear-gradient(currentColor,currentColor) 11px 50%/2px 6px no-repeat,
  linear-gradient(currentColor,currentColor) 16px 50%/2px 12px no-repeat}
#pdvol.mute .vg{color:#e5624d;background:
  linear-gradient(currentColor,currentColor) 0 50%/4px 6px no-repeat,
  linear-gradient(currentColor,currentColor) 4px 50%/4px 12px no-repeat,
  linear-gradient(currentColor,currentColor) 11px 50%/6px 2px no-repeat}
#pdvol .seg{display:inline-flex;gap:2px}
#pdvol .seg i{width:5px;height:12px;background:#2f3440}
#pdvol .seg i.on{background:#a6b1c7}
#pdvol.mute .seg i{background:#2f3440}
#pdvol b{font-weight:400;color:#9aa4b2;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
#pdvol.mute b{color:#e5624d}
/* buffering: the web's blocks, in the dock's own row, in place of a wheel */
#pdload{display:none;align-items:center;gap:10px;margin-left:auto;flex:none;
 font:16px/1 mgscodec,ui-monospace,monospace;letter-spacing:.3em;color:#cfd6e2}
#pdock.load #pdload{display:flex}
#pdock.load #pdmeta{display:none}
.blocks{display:flex;gap:5px}
.blocks i{width:9px;height:14px;background:#a6b1c7;opacity:.18;animation:blk 1.05s linear infinite}
.blocks i:nth-child(2){animation-delay:.15s}.blocks i:nth-child(3){animation-delay:.3s}
.blocks i:nth-child(4){animation-delay:.45s}.blocks i:nth-child(5){animation-delay:.6s}
.blocks i:nth-child(6){animation-delay:.75s}
@keyframes blk{0%{opacity:1}35%,100%{opacity:.18}}
#pdtrack{position:relative;height:4px;margin-top:5px;background:rgba(166,177,199,.22)}
#pdfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#a6b1c7;transition:width .5s linear}
#pdknob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;left:0;
 background:#e7ecf3;box-shadow:0 0 0 2px #2f3440;transition:left .5s linear}
.pdbot{display:flex;align-items:center;gap:10px}
.pdl{font-size:16px;letter-spacing:.24em;color:#9aa4b2}
.pdt{font-size:22px;letter-spacing:.06em;color:#e7ecf3;font-variant-numeric:tabular-nums}
/* who's here: one dot per link, the colour is the whole reading */
#proster{font:18px/1.3 mgshud,ui-monospace,monospace;letter-spacing:.08em;color:#cfd6e2;
 display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 20px;
 flex:1;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#proster .r{display:flex;align-items:center;gap:8px;white-space:nowrap}
#proster .d{width:8px;height:8px;border-radius:50%;background:#5b6472;flex:none;
 box-shadow:0 0 6px currentColor;color:inherit}
#proster .d.on{animation:pip 1.6s ease-in-out infinite}
@keyframes pip{0%,100%{opacity:1}50%{opacity:.45}}
#proster .me{color:#e7ecf3}
#proster .idle{opacity:.5}
#proster .tag{font-size:14px;opacity:.75;letter-spacing:.08em;color:#e8c15c}
#proster .idle .tag{color:#9aa4b2}
/* codec's own badge plate (MechChip "badge": the 9-slice at 2x, the label in
   its readout window) — the guest page's rule, for the dock and the card */
#pcmeta .mbadge{position:relative;display:inline-flex;align-items:center;justify-content:center;
 height:calc(16*var(--t2));min-width:40px;padding:0 6px;box-sizing:border-box;background:none;
 border-style:solid;border-width:calc(7*var(--t2)) calc(4*var(--t2)) calc(4*var(--t2)) calc(4*var(--t2));
 border-image-slice:7 4 4 4 fill;border-image-width:calc(7*var(--t2)) calc(4*var(--t2)) calc(4*var(--t2)) calc(4*var(--t2));
 border-image-repeat:stretch;image-rendering:pixelated}
#pcmeta .mbadge::before{content:"";position:absolute;left:calc(-2*var(--t2));right:calc(-2*var(--t2));
 top:var(--t2);height:calc(6*var(--t2));background:#181c23}
#pcmeta .mbsize{visibility:hidden;font:16px/1 mgshud,ui-monospace,monospace;letter-spacing:.08em;
 white-space:nowrap;height:0;overflow:hidden}
#pcmeta .mblabel{position:absolute;left:0;right:0;top:var(--t2);height:calc(6*var(--t2));display:flex;
 align-items:center;justify-content:center;font:16px/1 mgshud,ui-monospace,monospace;
 letter-spacing:.08em;color:#eef4f8;white-space:nowrap;text-shadow:none;
 /* the app's badge rule (MechChip): the window one art px inside the frame on
    all four sides (it rode high, flush under the top line — the ink sat ~1
    art px high on the Bravia), the INK centred (the trailing letter-space and
    the face's 1-px right bearing pushed it left), then one device pixel lower:
    the optical seat */
 padding-left:.1425em;transform:translateY(var(--dp,1px))}
/* the OSD flash plate: JOINED · NAME, PAUSED BY THE HOST, DOLBY VISION · 4K */
#posd{position:fixed;left:50%;top:34px;z-index:10;transform:translateX(-50%) translateY(-6px);
 padding:7px 16px 6px;white-space:nowrap;font:22px/1 mgshud,ui-monospace,monospace;
 letter-spacing:.14em;color:#e7ecf3;text-shadow:0 1px 3px rgba(0,0,0,.85);
 opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#posd::before{content:"";position:absolute;inset:0;z-index:-1;border-style:solid;
 border-width:calc(8*var(--t1));border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAXBJREFUeJztmzFOAzEQRcf2XgCJimtxBErEAagQFQdAlByBa1EhcYH1mGqiXeJ1UqA8vJ4nrZTEivT/m81WmSAicnV9U2RAvr8+Qxi1vDEt37y9f3BJLsj93e3h9eEOsPJPjw9csgvw/PIqspAQl4dWPsa4y0sqA179BKy8iEhKR0ddk/MsMUZR1dXn1ZZW3mT0jqpKSpPkPB+dbY7ZyvcuQVWrkzea97mVD6FPCaW0y8vvh2CNXsvLmdn7bfdHuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQuAA6AI0LoAPQnBRQyvZfzf8752Rv7gvYskHPElq7AtIScGrToidaHaoCcp4lpWkX5Y3avpDUBNjkt77QM7WBrh6CtlSoqru8lh2N1e7w0KuzoxJk8PX5H9UkA3oXAEQrAAAAAElFTkSuQmCC) 8 fill / calc(8*var(--t1)) / 0 stretch;
 image-rendering:pixelated;opacity:.92}
#posd.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* the hold: a film change, the end, the party closing, a real error. Solid
   when there is no picture to protect (it then also covers CAF's own grey
   app-name card, which bled through the old error scrim). */
#phold{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
 background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s}
#phold.on{opacity:1}
#phold.solid{background:#07090d}
#phold.load{background:#000}
#pholdIn{text-align:center;padding:0 24px;max-width:70vw;display:flex;flex-direction:column;align-items:center}
/* the order on the plate: the mark, the pause glyph, the title, the loading
   blocks UNDER the title and OVER the word (Seth), then the word, then diag */
#pholdIn .brand{order:0}#pholdIn .ic{order:1}#pholdIn .msg{order:2}#pholdIn .blocks{order:3}#pholdIn .sub{order:4}#pholdIn .diag{order:5}
/* one gap between everything on the plate (Seth) — each piece carries the
   gap above it, so whatever is hidden, the visible ones stay evenly spaced */
#pholdIn>*{margin:0}#pholdIn>*+*{margin-top:22px}
#pholdIn .ic{width:calc(65*var(--t1));height:calc(65*var(--t1));
 background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA0AAAANCAYAAABy6+R8AAAAOElEQVR4nGNgIAMwwhiPnr/6D2PLSYrhFWfCZpKSgsl/fOJYNRECo5qgYJAHBAuMAUoi2FICNnEA4EIOiqRjxj0AAAAASUVORK5CYII=) center/100% 100% no-repeat;image-rendering:pixelated;
 animation:breathe 2.6s ease-in-out infinite}
#phold.load #pholdIn .ic,#phold.end #pholdIn .ic{display:none}
#phold.wait #pholdIn .ic{filter:sepia(1) saturate(4.5) hue-rotate(-8deg) brightness(1.05)}
#phold.err #pholdIn .ic{filter:sepia(1) saturate(6) hue-rotate(-40deg) brightness(.95)}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
#pholdIn .blocks{justify-content:center;display:none}
#phold.load #pholdIn .blocks{display:flex}
#pholdIn .brand{font:400 14px/1 mgscodec,ui-monospace,monospace;letter-spacing:.34em;color:#9aa4b2}
#pholdIn .brand b{font-weight:600;color:#f4f7fb}
#pholdIn .msg{font:500 34px/1.3 mgscodec,ui-monospace,monospace;letter-spacing:.03em;color:#f0f4f9;
 text-shadow:0 2px 8px rgba(0,0,0,.9)}
#pholdIn .sub{font:22px/1.4 mgshud,ui-monospace,monospace;letter-spacing:.04em;color:#98a1b0;
 text-shadow:0 1px 5px rgba(0,0,0,.85)}
#pholdIn .diag{font:14px/1.4 mgshud,ui-monospace,monospace;letter-spacing:.12em;color:#6f7886}
#pholdIn .diag:empty{display:none}
/* the room's chat: the last few lines, gone when the room goes quiet. ONE
   home on a television — lower RIGHT, above the dock, the way a chat column
   sits beside a picture on a big screen — so it never floats mid-frame and
   never meets the paused card, which has the left. (A phone keeps the web
   player's lower-left feed: its dock buttons are on the right.) */
#pchat{position:fixed;right:40px;bottom:calc(30px + var(--dk));z-index:8;width:min(50ch,40vw);
 pointer-events:none;transition:opacity .3s,bottom .25s}
#pchat.idle{opacity:0}
#plog{max-height:26vh;overflow:hidden;display:flex;flex-direction:column;
 font:20px/1.35 mgshud,ui-monospace,monospace;letter-spacing:.05em}
#plog>:first-child{margin-top:auto}
#plog .ln{display:block;margin:3px 0;animation:lnIn .28s cubic-bezier(.2,.75,.2,1) both}
@keyframes lnIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#plog .ln .who{font-size:.8em;letter-spacing:.16em;margin-right:10px;text-shadow:0 1px 4px rgba(0,0,0,.95)}
#plog .ln .tx{color:#e7ecf3;word-break:break-word;font-family:depmono,ui-monospace,monospace;letter-spacing:0;
 font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8)}
#plog .ln.rx .tx{font-size:1.35em;line-height:1;vertical-align:-3px}
#plog .sys{font-size:.8em;letter-spacing:.24em;color:#8b95a5;margin:3px 0;text-shadow:0 1px 4px rgba(0,0,0,.95);animation:lnIn .28s cubic-bezier(.2,.75,.2,1) both}
/* the paused card: the invite, docked into the dark half of the frame — the
   poster in codec's frame, the logo or the title, the stars, who made it,
   what this set is playing it as. LEFT, so it never meets the dock. */
#pcard{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:flex-start;
 padding:0 0 70px 56px;pointer-events:none;opacity:0;transition:opacity .4s;
 background:linear-gradient(to right,rgba(1,1,1,.94) 0%,rgba(1,1,1,.88) 30%,rgba(1,1,1,.5) 58%,
   rgba(1,1,1,.12) 80%,rgba(1,1,1,0) 100%)}
#pcard.on{opacity:1}
#pcard.on #pctxt{animation:up .7s cubic-bezier(.2,.75,.2,1) both}
#pcard.on #pcpw{animation:pop .8s cubic-bezier(.2,.75,.2,1) both .05s}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* The film's own backdrop as the hero while the card is up — the invite's
   rule: the picture fills the frame, sharp, darkened where the words sit and
   along the foot where the dock sits, instead of a paused frame cut in half
   by the card's scrim. Under the card (its gradient does the darkening);
   absent art leaves the paused frame as it was. */
#pchero{position:fixed;inset:0;z-index:6;opacity:0;transition:opacity .5s;pointer-events:none;
 background-size:cover;background-position:center 30%;background-repeat:no-repeat}
#pchero::after{content:"";position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(9,11,16,.55) 0%,rgba(9,11,16,.25) 40%,rgba(9,11,16,.08) 100%),
 linear-gradient(0deg,rgba(9,11,16,.92) 0%,rgba(9,11,16,.55) 22%,transparent 48%)}
#pchero.on{opacity:1}
#pcpw{width:150px;aspect-ratio:2/3;flex:none;position:relative;display:none;
 filter:drop-shadow(0 18px 36px rgba(0,0,0,.6))}
#pcard.poster #pcpw{display:block}
#pcpost{width:100%;height:100%;object-fit:cover;display:block;background:#0c0f16;
 clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),
   calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px)}
#pcpw::after{content:"";position:absolute;inset:0;pointer-events:none;border-style:solid;
 border-width:calc(12*var(--t2));border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAANJJREFUeJzt27ENwlAQRMH7yBFVICQSYqiB5unAEnIVTo/IlMAEfye77GnzG1VV695dE7qdx1jWvft1f+oWYt27l+P4bO9hc/7renl0VdVJh2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaBlAB2gZQAdoGUAHaL/f4eOXdjajJn+f/wI25BY+YXLnQgAAAABJRU5ErkJggg==) 12 / calc(12*var(--t2)) / 0 stretch;
 image-rendering:pixelated}
#pctxt{min-width:0;max-width:46vw;margin-left:28px;text-shadow:0 1px 3px rgba(0,0,0,.6);
 display:flex;flex-direction:column;align-items:flex-start}
#pcbrand{display:inline-block;font:400 14px/1 mgscodec,ui-monospace,monospace;letter-spacing:.34em;
 color:#a6b1c7;padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid rgba(166,177,199,.5)}
#pcbrand b{font-weight:600;color:#f4f7fb}
/* the title logo on the card AND on the dock — tried the mark once, Seth
   preferred it in both places (2026-10-11) */
#pclogo{display:none;max-width:min(440px,100%);max-height:110px;width:auto;height:auto;margin:0 0 12px;
 object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
#pcard.logo #pclogo{display:block}
#pctitle{font:500 34px/1.1 mgscodec,ui-monospace,monospace;letter-spacing:.02em;color:#f4f7fb;
 text-shadow:0 2px 10px rgba(0,0,0,.85)}
#pcard.logo #pctitle{display:none}

// far ahead of the playhead (the whole film is usually already on disk), so on
// the TV it only adds a gap the viewer feels. Keep a small cushion, not four
// seconds — every second here is a second your friend hears the joke late.
// LAG is handed down by the hub — one cushion for the whole room, the worst
// screen's. This TV is very often that worst screen: HLS hands it whole
// segments, so it sits seconds behind the clock no matter what, and there is no
// rate control on CAF to nudge it forward with. Rather than pretend otherwise,
// it MEASURES how far behind it really runs and reports that as the cushion it

// who's here, on the dock's bottom row — one line each, a dot for the link
function renderPRoster(room){
  var r=pel('proster'); if(!r) return;
  r.textContent='';
  var names=[];
  for(var i=0;i<room.length;i++){
    var p=room[i], mine=!!p.me;
    if(!mine && p.st==='card' && (p.name||'guest').toLowerCase()==='guest') continue;
    var idle=(p.w===false)||p.st==='away', col=idle?'#5b6472':pingColor(p.rtt);
    var tag=p.w===false?'not watching':p.st==='away'?'away':p.st==='joining'?'joining':'';
    var d=document.createElement('div'); d.className='r'+(mine?' me':'')+(idle?' idle':'');
    var dot=document.createElement('span'); dot.className='d'+(p.rtt>=0&&!idle?' on':'');
    dot.style.color=col; dot.style.background=col; d.appendChild(dot);
    var nm=document.createElement('span'); nm.textContent=p.name+(mine?' (this TV)':'');
    if(tag){ var tg=document.createElement('span'); tg.className='tag'; tg.textContent=' '+tag; nm.appendChild(tg); }
    d.appendChild(nm); r.appendChild(d);
    if(!mine) names.push(p.name);

  var key=names.join('|');

    var was=PLASTWHO?PLASTWHO.split('|'):[], now=names;
    var came=now.filter(function(n){return was.indexOf(n)<0;}), went=was.filter(function(n){return now.indexOf(n)<0;});

// ── turn the subtitles ON ────────────────────────────────────────────────
// Nothing else does. A text track — whether declared in the HLS master as an
// EXT-X-MEDIA rendition or handed over as a sideloaded Cast track — is only
// ever OFFERED. Shaka, which is what CAF plays adaptive streams with, keeps
// text hidden until something asks for it, and DEFAULT=YES in a manifest is a
// hint about WHICH track to pick, not an instruction to display one. So the
// television fetched the WebVTT, listed the track, reported it active, and
// drew nothing — three separate tests, three different deliveries, same blank
// screen, because the last step was never taken.
//
// Wrapped whole: subtitles are worth having, and they are not worth a black
// screen. Anything unexpected in here must leave the film playing.
function armSubtitles(){
  castFailed=false;   // a load completed — clear any prior error face
  try{
    var ttm = pm.getTextTracksManager && pm.getTextTracksManager();
    if(!ttm) return;
    var tracks = ttm.getTracks() || [];
    if(!tracks.length) return;
    var pick = null;
    for(var i=0;i<tracks.length;i++){
      var lang=(tracks[i].language||'').toLowerCase();
      if(lang.indexOf('en')===0){ pick=tracks[i]; break; }
    }
    if(!pick) pick=tracks[0];
    var style=new cast.framework.messages.TextTrackStyle();
    // Size and background come from Settings ▸ OUTPUT on the desktop, baked in
    // when the hub serves this page — so the choice is made once, on the screen
    // that has a keyboard, and every television the house casts to obeys it.
    // 1.0 is the receiver's own default and reads BIG on a TV at viewing
    // distance: Cast sizes captions for accessibility, not for a film.
    style.fontScale=0.72;
    style.fontFamily='SANS_SERIF';
    style.foregroundColor='#FFFFFFFF';
    // Outlined by default. A box is the accessible choice and the safe one,
    // but it lays a black bar across the bottom of every shot; an outline
    // keeps white text readable over a bright frame without covering it.
    style.backgroundColor="#00000000";
    style.edgeType="OUTLINE";
    style.edgeColor='#000000FF';
    ttm.setTextTrackStyle(style);
    ttm.setActiveByIds([pick.trackId]);
  }catch(e){}
}

// Resume playback after buffering just ONE segment, not CAF's default (~2-3).
// Every seek on the per-segment HDR lane re-races the GPU per segment, so
// waiting for 2-3 segments to buffer was most of the ~10-15s seek latency —
// one SEG-second segment is enough to start.
try{
  var _ro=new cast.framework.CastReceiverOptions();
  var _pc=new cast.framework.PlaybackConfig();
  _pc.autoResumeNumberOfSegments=1;
  // #seek-buffer-fix: resume only after a FAT forward buffer, NOT 1s. The old
  // 1/1 config (tuned for the retired per-segment HDR lane) resumed at the thin
  // edge, so a SEEK — which flushes the buffer — played at the edge and chattered
  // against CAF's ~3s default pause: the DV seek micro-stutter (playhead 0.9x,
  // droppedFrames~0, bufferingTime creeping). autoPauseDuration BELOW
  // autoResumeDuration gives real hysteresis so it never chatters. Applied
  // GLOBALLY — live-verified smooth on ALL lanes (DV / HDR10 / SDR) with NO
  // seek-latency cost (the transcode lanes still landed seeks in ~3s).
  _pc.autoResumeDuration=8;
  _pc.autoPauseDuration=2;
  // (initialBandwidth was tried here and is INERT for this lane: the CAF SDK maps
  // it only to shaka abr.defaultBandwidthEstimate, i.e. rung choice — our DASH is
  // single-rep. Measured on Top Gun: identical ~12s head fill with and without.)
  _ro.playbackConfig=_pc;
  // #dv-deep-buffer: CAF's shaka runs a 10s forward buffer (streaming.bufferingGoal
  // default) and PlaybackConfig has no field for it — but the SDK merges a custom
  // `shakaConfig` AFTER its own defaults (cast_receiver_framework.js: Sn(a,c,
  // b.shakaConfig) then configure(c)), so bufferingGoal IS settable. Why it matters:
  // 18 of the 24 DV titles are 10s-GOP encodes, so each copy segment is one 10s GOP
  // (40-150 MB, per-segment peaks to 120 Mbps). A 10s buffer holds exactly ONE such
  // segment, so every fetch must beat realtime or it stalls — that is the Casino
  // Royale stutter (measured: fetches of 10-17s per 10.4s segment on a link whose
  // estimate read 50-65 Mbps). A deep buffer averages the peaks over many GOPs.
  // DV copy lane ONLY: the muxer is a stream copy (~16x realtime, whole film on
  // disk in minutes) so fetching a minute ahead is always a cache hit; the live
  // HDR10/SDR transcode lanes race an encoder frontier and would 504 if asked a
  // minute ahead, so they keep CAF's default. Applied per-load (LOAD interceptor)
  // because CAF reads playbackConfig when it configures shaka for that load.
  // #dv-parallel-fetch: measured on the Bravia's -74 dBm 5 GHz link (raw adb
  // push traces): ONE TCP flow peaks ~105 Mbps but collapses to 0 for 2-3 s
  // stretches (13 of 45 s under 30 Mbps — per-flow loss/RTO stalls), while
  // THREE parallel flows average 97 Mbps with one bad second — the others ride
  // through each stall. With the ~2 s DV pieces (#dv-pieces) shaka can keep
  // several piece fetches in flight, so a single flow's stall no longer starves
  // the pipeline. DV lane only (its pieces are all on disk; a live encoder lane
  // would just get more waiters at its frontier).
  // #gapjump: the MSE video SourceBuffer is capped in BYTES (measured on this
  // Bravia: it accepted 164.6 MB and threw QuotaExceededError at 171.4 MB), but
  // bufferingGoal is in SECONDS. At this title's ~20 Mbps average, 60 s fits;
  // across the IMAX peaks (36 Mbps+) it needs ~270 MB and cannot. shaka catches
  // the quota error, evicts and retries — and drops one GOP on the floor rather
  // than re-appending it, so ~10.4 s of film vanishes with NO error, NO rebuffer
  // and NO 504: the position simply jumps and the seekbar pops. That is the
  // "same spot every time" skip, fixed by film position because the bitrate
  // profile is. 32 s keeps the deep buffer the DV lane needs (CAF's default is
  // 10 s, and this cast ran clean for hundreds of seconds at 25-37 s ahead)
  // while leaving byte headroom at the peaks; bufferBehind stops already-played
  // video spending the same budget (a DV backward seek re-warms by design).
  // Default only. The HUB sizes this per title against the device's BYTE
  // ceiling and sends it as customData.dvGoal — see dv_buffer_goal() server-side.
  // A seconds value chosen here cannot be right for every film: this remux runs
  // 9.7 Mbps on a dialogue scene and 55 on an IMAX reel, and 60 s of the latter
  // is ~412 MB against a device that refuses at 171.4 MB.
  var DV_BUFFER_GOAL=24, DV_PREFETCH_PIECES=4;
  var DV_GOAL_FLOOR=20;
  function applyLaneBuffer(dv){
    try{
      var pc=null; try{ pc=pm.getPlaybackConfig(); }catch(e){}
      pc=pc||_pc;
      if(dv){ pc.shakaConfig={streaming:{bufferingGoal:DV_BUFFER_GOAL,
                                         segmentPrefetchLimit:DV_PREFETCH_PIECES}}; }
      else { try{ delete pc.shakaConfig; }catch(e){ pc.shakaConfig=undefined; } }
      pm.setPlaybackConfig(pc);
      mlog('lane buffer dv='+dv+' goal='+(dv?DV_BUFFER_GOAL:'caf-default'));
    }catch(e){ try{ mlog('lanebuf '+e); }catch(_e){} }
  }
  window.applyLaneBuffer=applyLaneBuffer;
  // ── keep the forward buffer inside the DEVICE's byte ceiling ──
  // bufferingGoal is seconds; the SourceBuffer's limit is BYTES (measured on
  // this Bravia: 164.6 MB accepted, 171.4 MB refused). A film that runs 9.7
  // Mbps in its opening and 55 across the IMAX reels cannot have one safe
  // seconds value — 60 s is 73 MB in the first case and 412 MB in the second.
  // So hold a byte BUDGET instead and convert it to seconds against the
  // bitrate we just measured, re-tuning as the film's density changes.
  // The reactive back-off below still exists, but every time it fires shaka
  // has already lost an append (~0.4 s of film, four times in the first three
  // minutes of a from-zero cast). This gets ahead of it instead.
  var DV_QUOTA_BUDGET = 130 * 1024 * 1024;   // bytes, under the 164.6 MB floor
  var DV_GOAL_MIN = 15, DV_GOAL_MAX = 60;
  var _dvRetuneAt = 0;
  function dvGoalForBps(bps){
    if(!bps || bps <= 0) return DV_BUFFER_GOAL;
    var secs = DV_QUOTA_BUDGET / bps;
    return Math.max(DV_GOAL_MIN, Math.min(DV_GOAL_MAX, Math.round(secs)));
  }
  window._dvRetune=function(){
    try{
      if(!_dvBps) return;
      var g = dvGoalForBps(_dvBps);
      // MONOTONIC DOWN, never up. Raising the goal again fights the reactive
      // back-off: measured 19.4 Mbps, pushed 20 -> 56, the buffer refilled past
      // the byte ceiling, the quota threw, the back-off pulled it down, and the
      // retune raised it again — an oscillation that cost dropped frames and a
      // visible skip (2026-09-15, seen live). The bps estimate is bytes over the
      // buffered-END advance, which UNDERSTATES bitrate whenever appends overlap,
      // so it is trustworthy as a reason to shrink and not as a reason to grow.
      // Within a session the goal only ever ratchets down; a new cast starts fresh.
      if(g >= DV_BUFFER_GOAL) return;
      // only for a change worth a reconfigure, and never more than once a
      // minute — thrashing the config is its own way to lose an append.
      if(Math.abs(g - DV_BUFFER_GOAL) < Math.max(4, DV_BUFFER_GOAL*0.25)) return;
      var now = Date.now();
      if(now - _dvRetuneAt < 60000) return;
      _dvRetuneAt = now;
      var was = DV_BUFFER_GOAL;
      DV_BUFFER_GOAL = g;
      applyLaneBuffer(true);
      mlog('QUOTA retune goal '+was+' -> '+g+' at '
           +((_dvBps*8)/1e6).toFixed(1)+' Mbps measured');
    }catch(e){}
  };
  // Belt and braces: a title denser than this one can still reach the cap, and
  // the cap is the DEVICE's, not something we can query. Back the goal off when
  // the quota actually throws so the buffer self-tunes per title instead of
  // losing a GOP every time it overruns.
  window._dvQuotaBackoff=function(){
    try{
      if(DV_BUFFER_GOAL<=DV_GOAL_FLOOR) return;
      var was=DV_BUFFER_GOAL;
      DV_BUFFER_GOAL=Math.max(DV_GOAL_FLOOR, Math.round(DV_BUFFER_GOAL*0.75));
      applyLaneBuffer(true);
      mlog('QUOTA backoff goal '+was+' -> '+DV_BUFFER_GOAL);
    }catch(e){}
  };
  // Live zoom channel: the worker pushes a scale here when the remote toggles
  // screen mode, so it lands with no reload (a new lane URL would re-encode and
  // rebuffer). Namespace must be whitelisted or CAF drops the message.
  function showToast(txt, ms, hide, prompt){
    /* the app's remote toasts (SUBTITLES · ENG, AUDIO · ENG 5.1, ZOOM, UP NEXT)
       on the face's flash plate; hide takes a held one down early, ms holds it
       longer than the flash (UP NEXT's countdown), prompt arms the remote's
       answer (Enter = now, Back = credits) for that long */
    if(hide){ window._upnextUntil=0; window._ctoastUntil=0; var o=pel('posd'); if(o) o.classList.remove('on'); return; }
    if(!txt) return;
    var hold=(ms&&ms>0)?ms:2200;
    window._upnextUntil=prompt?Date.now()+hold:0; window._ctoastUntil=Date.now()+hold;
    pflash((''+txt).toUpperCase(), hold); pdockOn(Math.min(hold,6000));
  }
  var ZOOM_NS='urn:x-cast:com.codec.zoom', SUB_NS='urn:x-cast:com.codec.sub', TOAST_NS='urn:x-cast:com.codec.toast';
  try{ _ro.customNamespaces={}; _ro.customNamespaces[ZOOM_NS]=cast.framework.system.MessageType.JSON;
       _ro.customNamespaces[SUB_NS]=cast.framework.system.MessageType.JSON;
       _ro.customNamespaces[TOAST_NS]=cast.framework.system.MessageType.JSON; }catch(e){}
  try{ ctx.addCustomMessageListener(ZOOM_NS,function(ev){ try{ setZoom(ev.data&&ev.data.scale, ev.data?(ev.data.tl||null):undefined); }catch(_e){} }); }catch(e){ try{ mlog('zoom-listener '+e); }catch(_e){} }
  // Live subtitle swap: worker pushes the active track's VTT url (or null=off) so
  // set_sub is instant for text subs — no lane restart, no rebuffer.
  try{ ctx.addCustomMessageListener(SUB_NS,function(ev){ try{ var d=ev.data||{}; if(d.style) applyCapStyle(d.style); if(d.url!==undefined) loadCap(d.url); }catch(_e){} }); }catch(e){ try{ mlog('sub-listener '+e); }catch(_e){} }
  // Transient action toast: worker flashes "SUBTITLES · ENG" / "AUDIO · ENG 5.1"
  // / "ZOOM" on the TV so a remote press confirms itself (echoes the app OsdToast).
  try{ ctx.addCustomMessageListener(TOAST_NS,function(ev){ try{ var d=ev.data||{}; showToast(d.text, d.ms, d.hide, d.prompt); }catch(_e){} }); }catch(e){ try{ mlog('toast-listener '+e); }catch(_e){} }
  // ── TV-remote control — Phase 1: receiver-local seek ─────────────────────
  // Capture-phase on window so the <video>/cast-media-player layer can't swallow
  // the keydown. Only keys we act on are preventDefault'd; Play/Pause (Enter /
  // MediaPlayPause) stays with CAF, which already toggles play on every lane
  // (codec's #tbar paints the seek/time feedback — the native bar is hidden by
  // hideCafTransport). Guide/Back are trapped no-ops for now
  // (Guide earns a badge/quality readout in Phase 3; Back is trapped so it can't
  // drop the cast). Worker-routed keys (Audio/Subtitle/Channel/Red/Green) later.
  // A held remote button fires key-repeat (~10-30 events/sec). Applying each as a
  // full seek stacked them into a huge jump that OVERSHOT TO ZERO, which reset the
  // media element — blanking the seekbar to 0 and dropping our custom overlay back
  // to the OS title, then a ~7s re-warm to recover. (Autonomously reproduced: 10
  // arrow-downs walked 605 -> 0, state NONE, title 'null'.) Coalesce a burst:
  // accumulate the deltas off the position at the START of the hold, CAP the total
  // so it can never blow past a sane window, and apply ONE seek 260ms after the
  // last press. A single tap still fires promptly. (#6 held-rewind overshoot)
  var _sbBase=-1,_sbT=-1,_sbTimer=0,SEEK_BURST_CAP=180;
  function remoteSeek(delta){
    if(_sbBase<0)_sbBase=pm.getCurrentTimeSec()||0;
    var t=((_sbT>=0)?_sbT:_sbBase)+delta;
    t=Math.max(_sbBase-SEEK_BURST_CAP,Math.min(_sbBase+SEEK_BURST_CAP,t)); // no overshoot-to-0
    var dur=pm.getDurationSec()||0; if(t<0)t=0; if(dur>0&&t>dur-1)t=dur-1;
    _sbT=t;
    // live preview: paint the accumulating target on the bar while holding, so the
    // seek isn't blind (see tbarRender #held-scrub-preview).
    scrubPreviewT=t; scrubPreviewUntil=Date.now()+900; pdockOn(1400);
    try{ pdockRender(); }catch(e){}
    if(_sbTimer)clearTimeout(_sbTimer);
    _sbTimer=setTimeout(function(){var T=_sbT;_sbBase=-1;_sbT=-1;_sbTimer=0;_applyRemoteSeek(T);},260);
  }
  function _applyRemoteSeek(T){
    var cur=pm.getCurrentTimeSec()||0,dur=pm.getDurationSec()||0;
    if(dur>0&&T>dur-1)T=dur-1; if(T<0)T=0;
    // DV needs a re-warp for a head/far target (open-GOP can't cold-start);
    // HDR10/SDR do a native timeline seek.
    var willRewarm=(DVWARM>0 && (T<DVWARM-HEAD_MARGIN||Math.abs(T-cur)>SEEK_NUDGE));
    // TV-remote DPAD is a LOCAL seek that bypasses the SEEK interceptor, so in a
    // party it must do here what the interceptor does there: move the room
    // authoritatively (else the host clock drags it back), grace the follow tick,
    // and still run the MANAGED re-warm for a DV head/far target. The old
    // `&& !roomControlled()` guard did NONE of these — it left a raw pm.seek that
    // wedged on DV and reverted on every lane. (#6 physical-remote party seek)
    // Author the room whenever this cast has a LAN write-channel (follower OR
    // DV-cast party host) — see the SEEK interceptor note. partyPost no-ops for a
    // pure solo cast, so the local re-warm below is the only effect there.
    if(!ourSync() && SYNC && SYNC.cmdUrl && SYNC.token){
      // FOLLOWER (has a direct room write-channel): author the room itself.
      postSeekDebounced(Math.max(0,T+(LAG||0)));
      lastSeek=Date.now(); userActUntil=Date.now()+(willRewarm?7000:2500);
    } else if(!ourSync() && SYNC && SYNC.rcUrl){
      // SOLO DV-cast HOST: never handed cmdUrl (that would cost it DV), so it has
      // no direct room write. Hand the seek to the desktop app over /rc — it
      // authors the room when it's hosting a party (partyDriving), else no-ops.
      // The local managed re-warm below still moves THIS TV. Mirrors audio/sub/zoom.
      rcPost('seek', T);
      lastSeek=Date.now(); userActUntil=Date.now()+(willRewarm?7000:2500);
    }
    if(willRewarm){ pendingSeekTarget=T; scheduleRewarm(T); return; }
    pm.seek(T); }
  window.addEventListener('keydown',function(e){ var k=e.key,kc=e.keyCode,ok=true;
    var upnext=Date.now()<(window._upnextUntil||0);
    if(upnext&&(k==='Enter'||kc===13)){ window._upnextUntil=0; rcPost('credits_go'); }
    else if(upnext&&k==='BrowserBack'){ window._upnextUntil=0; rcPost('credits_cancel'); }
    else if(kc===37)remoteSeek(-10); else if(kc===39)remoteSeek(10);
    else if(kc===38)remoteSeek(60); else if(kc===40)remoteSeek(-60);
    else if(k==='MediaAudioTrack')rcPost('audio');
    else if(k==='ClosedCaptionToggle')rcPost('sub');
    else if(k==='1')rcPost('sub_cycle');
    else if(k==='ChannelUp')rcPost('chan_next'); else if(k==='ChannelDown')rcPost('chan_prev');
    else if(k==='ColorF0Red')rcPost('stop'); else if(k==='ColorF1Green')rcPost('zoom');
    else if(k==='Guide'||k==='BrowserBack'){ /* trapped no-op until Phase 3 */ }
    else ok=false;
    if(ok){ try{e.preventDefault();e.stopPropagation();}catch(_e){} } },true);
  ctx.start(_ro);
}catch(e){ ctx.start(); }
</script></body></html>
